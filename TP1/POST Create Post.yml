info:
  name: POST Create Post
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/posts"
  body:
    type: json
    data: |-
      {
      "title": "Nouveau post",
      "body": "Ceci est le corps du nouveau post.",
      "userId": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Le code de statut est 201", function () {
          expect(res.status).to.equal(201);
        });

        test("La réponse contient un champ id", function () {
          expect(res.body).to.have.property("id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
