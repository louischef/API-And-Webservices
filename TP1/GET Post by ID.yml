info:
  name: GET Post by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/posts/1"
  headers:
    - name: User-Agent
      value: PostmanRuntime-TP
  auth:
    type: bearer
    token: demo-token-12345

runtime:
  scripts:
    - type: tests
      code: |-
        test("Le code de statut est 200", function () {
          expect(res.status).to.equal(200);
        });

        test("La réponse contient un champ id", function () {
          expect(res.body).to.have.property("id");
        });

        test("Le temps de réponse est inférieur à 1000 ms", function () {
          expect(res.responseTime).to.be.below(1000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
